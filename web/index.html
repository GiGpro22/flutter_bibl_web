<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web_bibl">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>web_bibl</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #f7f9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f7f9fc;
      z-index: 9999;
    }
    .splash-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      background: #1976d2;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      box-shadow: 0 8px 24px rgba(25, 118, 210, 0.25);
    }
    .splash-icon svg {
      width: 36px;
      height: 36px;
      fill: white;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 600;
      color: #1e293b;
      margin: 0 0 8px 0;
    }
    .splash-subtitle {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
    </div>
    <div class="splash-title">Электронная библиотека</div>
    <div class="splash-subtitle">Инициализация веб-приложения...</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function hideSplashScreen() {
      var splash = document.getElementById('splash-screen');
      if (splash && splash.style.display !== 'none') {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.remove();
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideSplashScreen);
    // Резервный таймер на случай задержки первого кадра
    setTimeout(hideSplashScreen, 2500);
  </script>
</body>
</html>
